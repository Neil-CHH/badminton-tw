<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>賽事 - 羽球賽事資料庫</title>
<meta name="theme-color" content="#1a7a4f">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b5c40">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<header class="topbar">
  <button class="back" onclick="history.length > 1 ? history.back() : location.href='./index.html'">‹</button>
  <h1 id="title">賽事</h1>
</header>
<main class="container">
  <div id="out" class="loading">載入中…</div>
</main>
<script src="./js/common.js"></script>
<script>
const oid = qs("id");
const PAGE = 150;
let T = null, shown = PAGE;
/* 參賽名單:[[組別, [[姓名, 單位], …]], …];entrySel 為目前展開的組別索引(-1 = 都沒展開) */
let ENTRY_GROUPS = [], entrySel = -1;
/* 賽程:schedDay 為目前選的日期("" = 全部),schedShown 為已畫筆數 */
let SCHED = [], schedShown = PAGE, schedDay = "";
let DRAWS = new Map();   // 組別 → 抽籤結果(LAPGO 開打前的分組籤表)

/* 抽籤結果:預賽畫成一格一小組(同組互為對手),純淘汰畫成籤位順序。
   kw 非空時只留符合的籤位;回傳 { hits, html }。 */
function drawHTML(d, kw) {
  let hits = 0;
  const pools = d.pools.map(p => {
    const seats = p.seats.filter(s => !kw || (s.unit || "").includes(kw) || s.members.some(m => m.includes(kw)));
    hits += seats.length;
    if (!seats.length) return "";
    return `<div class="pool"><div class="pool-h">${d.format === "pool" ? `${esc(p.name)} 組` : "籤位"}</div>` +
      seats.map(s => `<div class="seat">${d.format === "bracket" ? `<span class="pos">${s.pos}</span>` : ""}${
        s.members.length
          ? s.members.map(m => `<a href="./player.html?name=${encodeURIComponent(m)}">${esc(m)}</a>`).join("、") +
            (s.unit ? ` <span class="u">${esc(s.unit)}</span>` : "")
          : `<b>${esc(s.unit)}</b>`}</div>`).join("") + `</div>`;
  }).join("");
  return { hits, html: pools ? `<div class="pool-grid">${pools}</div>` : "" };
}
function drawNote(d) {
  // 賽程公布後這句就不該再出現(大佛盃 9/22 排定賽程);官方賽程只有時間、沒有場地。
  const tail = (T.matches || []).length ? ""
    : (T.schedule || []).length ? "比賽時間見上方賽程,官方未提供場地。"
    : "比賽時間與場地待官方公布賽程。";
  return `<div class="note" style="margin:4px 0 0">${d.format === "pool"
    ? "預賽為小組循環,同組互為對手;預賽後的決賽籤表待預賽結束才產生。"
    : "依籤位順序排列(輪空不列出),實際對戰以官方籤表為準。"}${tail}</div>`;
}

/* 同單位的人併成一列(單位照名單出現順序),比一人一格的長串好掃 */
function entryRowsHTML(people) {
  const byUnit = new Map();
  people.forEach(([nm, u]) => {
    if (!byUnit.has(u)) byUnit.set(u, []);
    byUnit.get(u).push(nm);
  });
  return [...byUnit].map(([u, nms]) => `<div class="entry-row"><span class="u">${esc(u || "—")}</span>` +
    nms.map(nm => `<a class="chip" href="./player.html?name=${encodeURIComponent(nm)}">${esc(nm)}</a>`).join("") +
    `</div>`).join("");
}

/* LAPGO 賽程的 type 直接來自來源,**不是**比分那套 matchtype(見 scrape_lapgo.schedule_data):
   來源自己把冠軍賽寫成 R2,而「決賽」指的是預賽之後的決賽階段(每組數筆)。
   兩者同頁出現會互相混淆,所以只在顯示層把「決賽」講成「決賽階段」;
   沒把握的代號(R3…)一律原樣顯示,不亂猜。 */
const SCHED_TYPE = { "R2": "冠軍賽", "R4": "四強", "R8": "八強", "R16": "十六強",
                     "R32": "三十二強", "R64": "六十四強", "決賽": "決賽階段" };
const WEEK = ["日", "一", "二", "三", "四", "五", "六"];

function schedDayLabel(d) {
  const [y, m, dd] = d.split("-").map(Number);
  return `${m}/${dd}(${WEEK[new Date(y, m - 1, dd).getDay()]})`;
}

function schedRow(x) {
  const t = SCHED_TYPE[x.type] || x.type || "";
  const s = x.sides;
  const side = i => `<div class="side${i ? " B" : ""}">` +
    (s[i].members.length
      ? s[i].members.map(m => `<a href="./player.html?name=${encodeURIComponent(m)}">${esc(m)}</a>`).join("、")
      : `<b>${esc(s[i].unit || "—")}</b>`) +
    (s[i].members.length && s[i].unit ? `<div class="unit">${esc(s[i].unit)}</div>` : "") + `</div>`;
  return `<div class="srow">
    <div class="head"><span>${esc(x.group)}${x.label ? " " + esc(x.label) : ""}</span>
      <span>${t ? `<span class="tag">${esc(t)}</span>` : ""}${schedDayLabel(x.date)} ${esc(x.time)}</span></div>
    ${s ? `<div class="vs">${side(0)}<div class="vs-x">vs</div>${side(1)}</div>`
        : `<div class="tbd">對戰組合待預賽結束後確定</div>`}
  </div>`;
}

function filteredSchedule() {
  const kw = document.getElementById("s-kw")?.value.trim() || "";
  const grp = document.getElementById("s-group")?.value || "";
  let rows = SCHED;
  if (schedDay) rows = rows.filter(x => x.date === schedDay);
  if (grp) rows = rows.filter(x => x.group === grp);
  if (kw) rows = rows.filter(x => (x.sides || []).some(sd =>
    sd.unit.includes(kw) || sd.members.some(m => m.includes(kw))));
  return rows;
}

function renderSchedule() {
  const rows = filteredSchedule();
  document.getElementById("slist").innerHTML =
    rows.slice(0, schedShown).map(schedRow).join("") || `<div class="empty">無符合的場次</div>`;
  const more = document.getElementById("s-more");
  if (rows.length > schedShown) {
    more.style.display = "block";
    more.textContent = `顯示更多(${schedShown} / ${rows.length})`;
  } else more.style.display = "none";
}

/* 組別一律畫成可換行的小標籤,一次只展開一組;有關鍵字時改成跨組搜尋結果 */
function renderEntries() {
  const kw = document.getElementById("e-kw").value.trim();
  const grps = document.getElementById("e-grps");
  const list = document.getElementById("e-list");
  if (kw) {
    grps.hidden = true;
    list.innerHTML = ENTRY_GROUPS.map(([g, people]) => {
      if (DRAWS.has(g)) {
        const r = drawHTML(DRAWS.get(g), kw);
        return r.hits ? `<div class="entry-g">${esc(g)} <small>(${r.hits})</small></div>` + r.html : "";
      }
      const hit = people.filter(([nm, u]) => nm.includes(kw) || u.includes(kw));
      return hit.length ? `<div class="entry-g">${esc(g)} <small>(${hit.length})</small></div>` + entryRowsHTML(hit) : "";
    }).join("") || `<div class="empty" style="padding:16px 0">名單中查無「${esc(kw)}」</div>`;
    return;
  }
  grps.hidden = false;
  grps.querySelectorAll(".chip.toggle").forEach(c => c.classList.toggle("on", +c.dataset.i === entrySel));
  if (entrySel < 0) {
    list.innerHTML = `<div class="note" style="margin:8px 0 0">點上方組別查看該組${
      DRAWS.size ? "分組籤表" : "名單"},或直接搜尋姓名/單位</div>`;
  } else {
    const [g, people] = ENTRY_GROUPS[entrySel];
    const d = DRAWS.get(g);
    list.innerHTML = d
      ? `<div class="entry-g">${esc(g)} <small>(${d.pools.reduce((n, p) => n + p.seats.length, 0)} 籤)</small></div>` +
        drawHTML(d, "").html + drawNote(d)
      : `<div class="entry-g">${esc(g)} <small>(${people.length})</small></div>` + entryRowsHTML(people);
  }
}

function matchSideHTML(m, side, isWinner) {
  const unit = m["team" + side] || "";
  const names = new Set();
  (m.scoreinfo || []).forEach(si => splitMembers(si["member" + side]).forEach(n => names.add(n)));
  return `<div class="side ${side === "B" ? "B" : ""} ${isWinner ? "winner" : ""}">
    <div class="pname">${[...names].map(playerLink).join("、") || "—"}</div>
    <div class="unit">${unit ? unitLink(unit) : ""}</div></div>`;
}

function matchRow(m) {
  const isTeam = m.HeadGroup === "團體";
  const games = (m.scoreinfo || []).map(si =>
    `<b>${esc(si.scoreA)}:${esc(si.scoreB)}</b>`).join("、");
  const total = isTeam ? `${esc(m.Asidescore)} : ${esc(m.Bsidescore)}` :
    (m.scoreinfo?.length ? `${esc(m.Asidescore)}:${esc(m.Bsidescore)}` : "—");
  return `<div class="mrow">
    <div class="head">
      <span>${esc(baseGroup(m.groupName))}・${esc(m.matchtype || "")}</span>
      <span>${esc(fmtDate(m.date))} ${esc(m.time || "")}・${esc(m.stadium || "")}</span>
    </div>
    <div class="vs">
      ${matchSideHTML(m, "A", m.winner === "A")}
      <div class="score">${total}</div>
      ${matchSideHTML(m, "B", m.winner === "B")}
    </div>
    <div class="games">${isTeam ? "各點" : "局分"}:${games || "—"}${m.abstain ? `・${esc(m.abstain)}` : ""}</div>
  </div>`;
}

function filteredMatches() {
  const kw = document.getElementById("m-kw")?.value.trim() || "";
  const grp = document.getElementById("m-group")?.value || "";
  let rows = T.matches || [];
  if (grp) rows = rows.filter(m => baseGroup(m.groupName) === grp);
  if (kw) rows = rows.filter(m =>
    (m.teamA || "").includes(kw) || (m.teamB || "").includes(kw) ||
    (m.scoreinfo || []).some(si =>
      (si.memberA || "").includes(kw) || (si.memberB || "").includes(kw)));
  return rows;
}

function renderMatches() {
  const rows = filteredMatches();
  const el = document.getElementById("mlist");
  el.innerHTML = rows.slice(0, shown).map(matchRow).join("") ||
    `<div class="empty">無符合的場次</div>`;
  const more = document.getElementById("m-more");
  if (rows.length > shown) {
    more.style.display = "block";
    more.textContent = `顯示更多(${shown} / ${rows.length})`;
  } else more.style.display = "none";
}

function render() {
  document.getElementById("title").textContent = T.name;
  document.title = `${T.name} - 羽球賽事資料庫`;
  let html = "";

  if (T.image) html += `<div class="card hero"><img src="${esc(T.image)}" alt="" loading="lazy"
    onerror="this.parentElement.style.display='none'"></div>`;

  html += `<div class="card"><div class="pad">
    ${statusBadge(effectiveStatus(T))} <span class="chip off">${esc(T.city)}</span>
    ${T.category ? `<span class="chip cat">${esc(T.category)}</span>` : ""}
    <span class="chip src">${esc(sourceLabel(T))}</span>
    <div class="kv" style="margin-top:10px">
      <span class="k">比賽日期</span><span>${fmtRange(...effectiveDates(T))}</span>
      <span class="k">報名期間</span><span>${fmtRange(T.registerStart, T.registerEnd)}</span>
      <span class="k">比賽地點</span><span>${esc(T.venue || "—")}</span>
    </div>
    <div style="margin-top:10px">
      ${officialUrl(T) ? `<a class="btn-link" target="_blank" rel="noopener"
         href="${esc(officialUrl(T))}">🔗 官方賽事查詢</a>` : ""}
      ${effectiveStatus(T) === "registering" && sourceOf(T) === "mylivescore" ? `<a class="btn-link" target="_blank" rel="noopener"
         href="https://ef-regist.com/chkagreement/agreement.php?id=${encodeURIComponent(T.openid)}">📝 線上報名</a>` : ""}
    </div>
  </div></div>`;

  if (T.category === "排名賽" && T.promotion) {
    html += `<div class="card promo-card"><div class="pad">
      <div class="promo-title">🎖️ 晉升甲組</div>
      <div>${esc(T.promotion)}</div>
      <div class="note" style="margin-bottom:0">全國羽球排名賽是晉升中華民國羽球協會甲組的途徑;名次與晉升以官方總成績紀錄為準。</div>
    </div></div>`;
  }

  const r = T.regulation;
  if (r) {
    html += `<h2 class="sec">📜 競賽規程</h2><div class="card"><div class="pad"><div class="kv">
      ${r.organizer ? `<span class="k">主辦單位</span><span>${esc(r.organizer)}</span>` : ""}
      ${r.ball ? `<span class="k">比賽用球</span><span>${esc(r.ball)}</span>` : ""}
      ${r.fee ? `<span class="k">報名費用</span><span>${esc(r.fee)}</span>` : ""}
      ${r.souvenir ? `<span class="k">紀念品</span><span>${esc(r.souvenir)}</span>` : ""}
      ${r.awards ? `<span class="k">得獎獎勵</span><span style="white-space:pre-wrap">${esc(r.awards)}</span>` : ""}
      ${r.notes ? `<span class="k">備註</span><span style="white-space:pre-wrap">${esc(r.notes)}</span>` : ""}
    </div>${r.pdf ? `<div style="margin-top:10px"><a class="btn-link" target="_blank" rel="noopener" href="${esc(r.pdf)}">📄 規程 PDF</a></div>` : ""}
    </div></div>`;
  } else {
    html += `<div class="note">尚無規程資料(用球/紀念品/獎勵等)。可將規程 PDF 交給 Claude 以 /badminton-import 匯入補充。</div>`;
  }
  if (T.resultPdf) {
    html += `<div style="margin:6px 0"><a class="btn-link" target="_blank" rel="noopener" href="${esc(T.resultPdf)}">📄 總成績紀錄 PDF</a></div>`;
  }

  const docs = T.documents || [];
  if (docs.length) {
    html += `<h2 class="sec">📁 賽事文件 <small>(連至官方)</small></h2><div class="card">` +
      docs.map(d => {
        const icon = d.type === "規程" ? "📜" : d.type === "成績" ? "🏆" : "📄";
        return `<a class="srow" target="_blank" rel="noopener" href="${esc(d.url)}">
          <div><div>${icon} ${esc(d.title)}</div></div>
          <div class="cnt">${esc(fmtDate(d.date))}</div></a>`;
      }).join("") + `</div>`;
  }

  if ((T.standings || []).length) {
    const anyPromo = T.standings.some(s => s.promoted);
    html += `<h2 class="sec">🏆 各組名次</h2><div class="card"><table class="plain">
      <tr><th>組別</th><th>名次</th><th>單位</th><th>成員</th></tr>` +
      T.standings.map(s => {
        const units = (s.memberUnits && s.memberUnits.length)
          ? [...new Set(s.memberUnits)].map(unitLink).join("／")
          : (s.unit ? unitLink(s.unit) : "—");
        const promo = s.promoted ? ` <span class="chip-promo">晉甲</span>` : "";
        return `<tr class="${s.promoted ? "promoted" : ""}">
        <td>${esc(s.group)}</td>
        <td class="${rankClass(s.rank)}">${esc(rankLabel(s.rank))}${promo}</td>
        <td>${units}</td>
        <td>${(s.members || []).flatMap(splitMembers).map(playerLink).join("、") || "—"}</td>
      </tr>`;
      }).join("") + `</table></div>
      <div class="note">${(() => {
        const srcs = new Set(T.standings.map(s => s.source || "derived"));
        const parts = [];
        if (srcs.has("derived")) parts.push("由決賽比分自動推導(循環賽制組別可能無法推導)");
        if (srcs.has("official")) parts.push("由主辦單位公布的成績總表匯入");
        if (srcs.has("pdf")) parts.push("由官方成績 PDF 匯入");
        if (srcs.has("ocr")) parts.push("由官方成績表圖片辨識並比對參賽名冊校正");
        return "名次" + parts.join(";") + "。";
      })()}${anyPromo ? "標「晉甲」者為晉升中華民國羽球協會甲組之選手。" : ""}</div>`;
  }

  // 賽程:抽籤後、開打前最即時的資訊(幾點打、跟誰打),所以排在參賽名單之前。
  // 但筆數和名單同級(大佛盃 1409 場),一樣整段預設收起,免得把底下的東西推到看不見。
  SCHED = T.schedule || [];
  if (SCHED.length) {
    const days = [...new Set(SCHED.map(x => x.date))].sort();
    const sgrps = [...new Set(SCHED.map(x => x.group))].filter(Boolean)
      .sort((a, b) => a.localeCompare(b, "zh-Hant"));
    const tbd = SCHED.filter(x => !x.sides).length;
    schedDay = days[0] || "";
    html += `<details class="card entries-sec">
      <summary><span>🗓️ 賽程</span><small>${days.length} 天・${SCHED.length} 場</small></summary>
      <div class="pad">
        <div class="filters">
          <select id="s-day">${days.map(d =>
            `<option value="${d}">${schedDayLabel(d)}</option>`).join("")}<option value="">全部日期</option></select>
          <select id="s-group"><option value="">全部組別</option>
            ${sgrps.map(g => `<option>${esc(g)}</option>`).join("")}</select>
          <input type="search" id="s-kw" placeholder="選手姓名或單位">
        </div>
        <div id="slist"></div>
        <button class="btn-more" id="s-more" style="display:none"></button>
        <div class="note" style="margin-bottom:0">賽程取自官方賽程表,時間為預定開賽時間,
          實際以現場公告為準;官方賽程未提供場地與球場編號。${
            tbd ? `其中 ${tbd} 場要等預賽結束才定得出對戰組合。` : ""}</div>
      </div></details>`;
  }

  const entries = T.entries || [];
  DRAWS = new Map((T.draws || []).map(d => [d.group, d]));
  if (entries.length || DRAWS.size) {
    const byGroup = new Map();
    entries.forEach(e => {
      const g = e.group || "其他";
      if (!byGroup.has(g)) byGroup.set(g, []);
      (e.members || []).flatMap(splitMembers).forEach(nm => byGroup.get(g).push([nm, e.unit || ""]));
    });
    // 團體組籤表只有隊名、沒有隊員,不在 entries 裡,組別要從籤表補進來
    DRAWS.forEach((_, g) => { if (!byGroup.has(g)) byGroup.set(g, []); });
    ENTRY_GROUPS = [...byGroup.keys()].sort((a, b) => a.localeCompare(b, "zh-Hant"))
      .map(g => [g, byGroup.get(g)]);
    const cov = T.entriesCoverage;
    // 名單動輒上千人次(豐原主委盃 52 組 1105 人次、tsba 清晨盃 7847 人次),攤開會把
    // 底下的組別與逐場比分整個推到看不見的地方 → 整段一律預設收起;展開後組別也只畫成
    // 一排排小標籤(以前一組一列,27 組就是 27 列),點一組才列出該組名單。
    // 這純粹是顯示層的收合:search-index 由 rebuild_index 直接從賽事 JSON 建,
    // 跟這裡畫不畫、開不開完全無關,搜尋照樣找得到人。
    html += `<details class="card entries-sec">
      <summary><span>👥 參賽名單${DRAWS.size ? "・分組籤表" : ""}</span>
        <small>${ENTRY_GROUPS.length} 組・${
          // 算人不算筆:籤表一筆雙打 = 兩人,用筆數會讓同一份名單看起來少了三成
          ENTRY_GROUPS.reduce((n, [, people]) => n + people.length, 0)} 人次</small></summary>
      <div class="pad">
        <input type="search" id="e-kw" class="entry-kw" placeholder="🔍 在名單中找選手或單位">
        <div id="e-grps">` +
      ENTRY_GROUPS.map(([g, people], i) =>
        `<span class="chip toggle" data-i="${i}">${esc(g)} <small>${
          people.length || (DRAWS.has(g) ? DRAWS.get(g).pools.reduce((n, p) => n + p.seats.length, 0) : 0)
        }</small></span>`).join("") +
      `</div><div id="e-list"></div>
      <div class="note" style="margin-bottom:0">${(() => {
          const srcs = new Set(entries.map(e => e.source || "draw"));
          const parts = [];
          if (srcs.has("draw") || DRAWS.size) parts.push(sourceOf(T) === "lapgo" ? "官方抽籤結果" : "官方賽程表(籤表)");
          if (srcs.has("signup")) parts.push("官方報名結果總表");
          return "名單取自" + parts.join("與");
        })()},用於讓未得名的選手也查得到。名單為賽前版本,可能不含補報名、且含後來棄權者${
          cov != null && cov < 0.98 ? `;本賽事約收錄官方公告人數的 ${Math.round(cov * 100)}%` : ""
        }。</div></div></details>`;
  }

  // 組別動輒 50 幾個(豐原主委盃 52 組),攤開就是滿滿一片標籤,把底下的比分推到看不見
  // → 收納方式與參賽名單一致:整段 details、預設收起,summary 上先講組數。
  const groups = T.groups || [];
  if (groups.length) {
    const linked = groups.filter(g => g.drawUrl).length;
    html += `<details class="card entries-sec">
      <summary><span>🎯 競賽組別</span><small>${groups.length} 組</small></summary>
      <div class="pad">` +
      groups.map(g => g.drawUrl
        ? `<a class="chip" target="_blank" rel="noopener" href="${esc(g.drawUrl)}">${esc(g.name)} ↗</a>`
        : `<span class="chip off">${esc(g.name)}</span>`).join("") +
      (linked ? `<div class="note" style="margin-bottom:0">點組別可開官方籤表/晉級圖(由主辦提供,尚未產生籤表的組別會開不起來)</div>` : "") +
      `</div></details>`;
  }

  if ((T.matches || []).length) {
    const gnames = [...new Set(T.matches.map(m => baseGroup(m.groupName)))].filter(Boolean)
      .sort((a, b) => a.localeCompare(b, "zh-Hant"));
    html += `<h2 class="sec">📊 逐場比分 <small>(${T.matches.length} 場)</small></h2>
      <div class="filters">
        <select id="m-group"><option value="">全部組別</option>
          ${gnames.map(g => `<option>${esc(g)}</option>`).join("")}</select>
        <input type="search" id="m-kw" placeholder="選手姓名或單位">
      </div>
      <div class="card" id="mlist"></div>
      <button class="btn-more" id="m-more" style="display:none"></button>`;
  } else if (!notStarted(T) && effectiveStatus(T) !== "registering") {
    html += `<div class="note">此賽事未使用線上計分系統,無逐場比分資料。</div>`;
  }

  document.getElementById("out").innerHTML = html;
  if (SCHED.length) {
    const reset = fn => ev => { fn(ev); schedShown = PAGE; renderSchedule(); };
    document.getElementById("s-day").onchange = reset(ev => { schedDay = ev.target.value; });
    document.getElementById("s-group").onchange = reset(() => {});
    document.getElementById("s-kw").oninput = reset(() => {});
    document.getElementById("s-more").onclick = () => { schedShown += PAGE; renderSchedule(); };
    renderSchedule();
  }
  if (ENTRY_GROUPS.length) {
    document.getElementById("e-kw").oninput = renderEntries;
    document.getElementById("e-grps").onclick = ev => {
      const c = ev.target.closest(".chip.toggle");
      if (!c) return;
      entrySel = entrySel === +c.dataset.i ? -1 : +c.dataset.i;
      renderEntries();
    };
    renderEntries();
  }
  if ((T.matches || []).length) {
    document.getElementById("m-group").onchange = () => { shown = PAGE; renderMatches(); };
    document.getElementById("m-kw").oninput = () => { shown = PAGE; renderMatches(); };
    document.getElementById("m-more").onclick = () => { shown += PAGE; renderMatches(); };
    renderMatches();
  }
}

async function init() {
  renderNav("matches");
  T = await loadJSON(`tournaments/${oid}.json`);
  render();
}
init().catch(e => document.getElementById("out").innerHTML =
  `<div class="empty">資料載入失敗:${esc(e.message)}</div>`);
</script>
</body>
</html>
